<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Copilot card</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head><body>
<div class="or-wrap">
  <div class="or-card">
    <div class="or-card-h"><span class="or-display" style="color:var(--violet-soft)">✦</span>Match analysis<span class="tag">70% now</span></div>
    <div class="or-card-b">
      <div class="or-mr">
        <svg viewBox="0 0 78 78"><circle cx="39" cy="39" r="32" fill="none" stroke="var(--surface-2)" stroke-width="8"/>
          <circle cx="39" cy="39" r="32" fill="none" stroke="var(--gold)" stroke-width="8" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="60.3"/></svg>
        <b class="num">70%</b>
      </div>
      <div class="or-gaps">
        <div><span class="d" style="background:var(--match)"></span>React + TypeScript — strong</div>
        <div><span class="d" style="background:var(--gold)"></span>Design-system ownership — partial</div>
        <div><span class="d" style="background:var(--gap)"></span>Core Web Vitals — missing</div>
        <div><span class="d" style="background:var(--gap)"></span>Accessibility (WCAG) — missing</div>
      </div>
    </div>
    <div class="or-card-f">
      <button class="or-btn or-btn-primary or-btn-sm">Open full simulation</button>
      <button class="or-btn or-btn-ghost or-btn-sm">Close the gaps</button>
    </div>
  </div>
</div>
</body></html>

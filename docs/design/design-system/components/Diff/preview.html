<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Diff</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head><body>
<div class="or-wrap">
  <div class="or-diff">
    <div class="or-diff-h">Suggested edit<span class="because">fact-grounded</span></div>
    <div class="or-diff-b">
      <div class="or-diff-old">Responsible for the component library used across the product.</div>
      <div class="or-diff-new">Owned the company-wide component library, cutting new-feature build time ~30% across 6 product teams.</div>
      <div class="or-diff-why">✓ Stronger verb + your real metric. Nothing invented.</div>
    </div>
    <div class="or-diff-actions">
      <button class="or-rej">Reject</button>
      <button class="or-acc">Accept change</button>
    </div>
  </div>
</div>
</body></html>

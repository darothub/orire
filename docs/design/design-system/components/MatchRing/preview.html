<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Match ring</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>.rings{display:flex;gap:40px;align-items:center;justify-content:center;padding:24px;flex-wrap:wrap}</style>
</head><body>
<div class="rings">
  <div class="or-ring">
    <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="60" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
      <circle cx="75" cy="75" r="60" fill="none" stroke="var(--match)" stroke-width="12" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="34.7"/></svg>
    <div class="pct"><b class="num">91%</b><span>match</span></div>
  </div>
  <div class="or-ring">
    <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="60" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
      <circle cx="75" cy="75" r="60" fill="none" stroke="var(--gold)" stroke-width="12" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="113.1"/></svg>
    <div class="pct"><b class="num">70%</b><span>best current</span></div>
  </div>
</div>
</body></html>

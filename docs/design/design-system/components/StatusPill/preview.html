<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Status pill</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head><body>
<div class="or-row">
  <span class="or-pill or-pill-saved"><span class="dot" style="background:var(--muted)"></span>Saved</span>
  <span class="or-pill or-pill-applied"><span class="dot" style="background:var(--violet)"></span>Applied</span>
  <span class="or-pill or-pill-interview"><span class="dot" style="background:var(--gold)"></span>Interview</span>
  <span class="or-pill or-pill-offer"><span class="dot" style="background:var(--match)"></span>Offer</span>
</div>
</body></html>

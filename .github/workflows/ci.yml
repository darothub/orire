# orire — GitHub Actions CI
#
# Runs on every pull request and on pushes to main:
#   • checks  — eslint, tsc (typecheck) and vitest unit tests
#   • build   — a full production `next build`
#   • e2e     — Playwright smoke/full suite with disposable PostgreSQL
#
# Deploys are NOT handled here. Production (main) and PR preview deploys run
# through Vercel's native GitHub integration, which builds with
# `prisma migrate deploy && next build` (see vercel.json / docs/deploy.md).
#
# Builds need no live database. Browser tests use only the disposable local
# PostgreSQL service below; no production DB, SMTP or AI provider is needed.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy datasource — enough for `prisma generate` and `next build`, which
  # never open a connection at build time.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"

jobs:
  checks:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Generate Next's route/layout/page type defs (.next/types/**) that
      # tsconfig includes — without them a fresh checkout fails on the
      # generated globals (e.g. LayoutProps). Lighter than a full build.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # E2E owns its production build and can run alongside code checks.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orire_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d orire_e2e_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: "true"
      E2E_PREBUILT: "1"
      NEXT_PUBLIC_PASSWORD_AUTH: "true"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/orire_e2e_ci?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/orire_e2e_ci?schema=public"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify documentation-only PR
        id: docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "pull_request" ]] && git diff --name-only "$BASE_SHA"...HEAD > /tmp/orire-docs-changes; then
            if [[ -s /tmp/orire-docs-changes ]] && ! grep -Ev '^((docs/.*)|(.*[.]md))$' /tmp/orire-docs-changes; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Docs-only: E2E skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.docs.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.docs.outputs.skip != 'true'
      - name: Apply Prisma schema to CI Postgres
        if: steps.docs.outputs.skip != 'true'
        run: npx prisma migrate deploy
      - name: Cache Playwright browsers
        if: steps.docs.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      # GitHub's ubuntu-latest image already includes Chromium's shared libraries.
      # Avoid apt installation of 25MB of fonts/upgrades from a slow mirror:
      # run #39859528021 exhausted 8 minutes before any test could start.
      # Verify Chromium really launches below; do not silently skip dependency errors.
      - name: Install Playwright Chromium browser
        if: steps.docs.outputs.skip != 'true'
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Verify Chromium can launch
        if: steps.docs.outputs.skip != 'true'
        timeout-minutes: 2
        run: node -e 'const { chromium } = require("@playwright/test"); chromium.launch({headless:true}).then(b => b.close()).catch(e => { console.error(e); process.exit(1); });'
      - name: Cache Next.js incremental build data
        if: steps.docs.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'app/**', 'pages/**', 'public/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-
      - name: Capture build start
        if: steps.docs.outputs.skip != 'true'
        id: build_clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build once for browser tests
        if: steps.docs.outputs.skip != 'true'
        timeout-minutes: 8
        run: npm run build
      - name: Record build elapsed time
        if: steps.docs.outputs.skip != 'true'
        env:
          STARTED: ${{ steps.build_clock.outputs.started }}
        run: |
          seconds=$(( $(date +%s) - STARTED ))
          echo "Next.js production build: ${seconds}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Choose PR smoke or full regression
        if: steps.docs.outputs.skip != 'true'
        id: tier
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          MODE=smoke
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            MODE=full
          else
            # Full coverage for changes to security-sensitive or shared
            # application paths, with a safe fallback if diff inspection fails.
            if ! git diff --name-only "$BASE_SHA"...HEAD > /tmp/orire-changed-files; then
              MODE=full
            elif grep -Eq '^(e2e/|src/app/api/|src/lib/(auth|payments|stripe|e2e)/|src/components/ai/|src/components/templates/|prisma/|package(-lock)?[.]json|playwright[.]config[.]ts|[.]github/workflows/)' /tmp/orire-changed-files; then
              MODE=full
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Selected $MODE Playwright coverage" >> "$GITHUB_STEP_SUMMARY"
      - name: Run PR critical smoke
        if: steps.docs.outputs.skip != 'true' && steps.tier.outputs.mode == 'smoke'
        timeout-minutes: 12
        run: npx playwright test --grep '@smoke'
      - name: Run full Playwright regression
        if: steps.docs.outputs.skip != 'true' && steps.tier.outputs.mode == 'full'
        timeout-minutes: 18
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.docs.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          retention-days: 7

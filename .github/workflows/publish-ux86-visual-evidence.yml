name: Publish UX86 review images

on:
  push:
    branches: ["design/ux86-browser-proposal"]

permissions:
  contents: write
  actions: read

jobs:
  publish-visual-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch successful real-app Playwright captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/orire-ux86-visuals
          gh run download 39696781379 \
            --repo darothub/orire \
            --name playwright-report \
            --dir /tmp/orire-ux86-visuals

      - name: Publish real before and browser-only proposal screenshots to an asset branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          src=/tmp/orire-ux86-visuals/test-results/ux86-proposal
          test -f "$src/BEFORE-real-demo-mobile-390.png"
          test -f "$src/AFTER-PROPOSED-demo-mobile-390.png"
          dest=$(mktemp -d)
          cd "$dest"
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -qb ux86-visual-evidence
          mkdir -p ux86
          cp "$src/"*.png ux86/
          cat > README.md <<'EOF'
          # Issue #86 visual design evidence
          - Baseline: actual Orire application, run via GitHub Actions Playwright in Chromium.
          - **BEFORE-real**: actual current app screen.
          - **AFTER-PROPOSED**: SAME running app with CSS/menu injected in browser ONLY.
          - Proposal is **not an implementation** and has not been approved.
          - Test run: https://github.com/darothub/orire/actions/runs/39696781379
          - PR: https://github.com/darothub/orire/pull/104
          - Viewports: 320x720, 390x844, 1440x900.
          - All visuals use fictitious demo data; no user CV data.
          EOF
          git add README.md ux86
          git commit -qm "docs: retain real Orire UX86 before/after proposal screenshots"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/darothub/orire.git" HEAD:refs/heads/ux86-visual-evidence

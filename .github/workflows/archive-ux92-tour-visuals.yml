name: Archive UX92 tour screenshots

on:
  push:
    branches: ["fix/ux92-onboarding-tour-modal-focus"]
    paths: [".github/workflows/archive-ux92-tour-visuals.yml"]

permissions:
  contents: write
  actions: read

jobs:
  attach-real-tour-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download passed Playwright browser captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39736812786 --repo darothub/orire \
            --name playwright-report --dir /tmp/ux92-tour-browser
      - name: Archive actual Orire mobile and desktop screenshots
        run: |
          set -eu
          src=/tmp/ux92-tour-browser/test-results/ux92-tour
          test -s "$src/AFTER-tour-keyboard-mobile-390.png"
          test -s "$src/AFTER-tour-keyboard-desktop-1440.png"
          mkdir -p docs/visual-qa/ux92-tour
          cp "$src/"*.png docs/visual-qa/ux92-tour/
          cat > docs/visual-qa/ux92-tour/README.md <<'EOF'
          # UX #92: keyboard-accessible onboarding tour

          Genuine Orire Chromium/Playwright screenshots of the updated
          first-run onboarding modal, NOT AI mockups or a visual redesign.

          Capture CI: https://github.com/darothub/orire/actions/runs/39736812786
          Implementation PR: https://github.com/darothub/orire/pull/109
          32 end-to-end tests passed; build, lint, typecheck and unit tests passed.

          Screenshots: mobile 390x844 and desktop 1440x900, anonymous fiction
          sample data via E2E signed-in session; reduced-motion preference.
          Baseline: normal tour design/appearance remains unchanged; this PR
          improves focus containment, Tab/Shift+Tab, native button activation,
          Escape, and background inert state. Focus outline is visible only
          when a tour action button has keyboard focus.

          The larger accessibility audit at #92 remains open.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/visual-qa/ux92-tour
          git commit -m "docs(ux92): archive real before-review onboarding tour screenshots"
          git push origin HEAD:refs/heads/fix/ux92-onboarding-tour-modal-focus

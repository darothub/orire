name: Archive UX85 actual review screenshots

on:
  push:
    branches: ["fix/ux85-refine-safe-review"]
    paths: [".github/workflows/archive-ux85-real-review.yml"]

permissions:
  contents: write
  actions: read

jobs:
  archive-ux85-real-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch successful locally rendered Playwright screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39758875128 --repo darothub/orire \
            --name playwright-report --dir /tmp/ux85-browser
      - name: Store actual Orire review images for issue and PR
        run: |
          set -eu
          src=/tmp/ux85-browser/test-results/ux85-review
          test -s "$src/AFTER-actual-AI-review-default-reject-desktop-1440.png"
          test -s "$src/AFTER-actual-AI-review-default-reject-mobile-390.png"
          test -s "$src/AFTER-actual-AI-review-panel-desktop-1440.png"
          test -s "$src/AFTER-actual-AI-review-panel-mobile-390.png"
          mkdir -p docs/visual-qa/ux85
          cp "$src/"*.png docs/visual-qa/ux85/
          cat > docs/visual-qa/ux85/README.md <<'EOF'
          # #85 actual Orire AI review screenshots (phase 1)

          These four PNGs are actual Chromium/Playwright captures from the real
          built Orire app running locally in hermetic CI, NOT design mockups.
          No production account, live AI call, billing or customer CV is used.
          Captured on CI #39758875128:
          https://github.com/darothub/orire/actions/runs/39758875128
          Build, lint, TS/unit and 40 Playwright tests passed.
          Fictional sample CV: Ada Okonkwo, intercepted AI claim: 999% and 5000.
          Review starts with 0 of 2 suggestions accepted and flags invented metrics.
          Desktop viewport 1440x900 and mobile 390x844.
          Desktop review side-by-side, mobile review stacks suggestions vertically.
          The mobile element capture shows a sticky Edit/Preview pane control across
          the review content. Issue #114 tracks whether this is genuine UI
          obstruction or screenshot stitching, using a visual-approval gate.
          Source PR: https://github.com/darothub/orire/pull/113
          Remaining broader #85 audit covers Re-brand, import and Simulate.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/visual-qa/ux85
          git commit -m "docs(ux85): archive actual desktop and mobile AI review screenshots"
          git push origin HEAD:refs/heads/fix/ux85-refine-safe-review
